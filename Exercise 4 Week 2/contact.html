<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | PokéShop</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html">🔴⚪ PokéShop</a>
        <div class="navbar-nav ms-auto">
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="products.html">Products</a>
          <a class="nav-link active" aria-current="page" href="contact.html"
            >Contact</a
          >
          <a class="nav-link" href="about.html">About</a>
        </div>
      </div>
    </nav>

    <main class="flex-fill">
      <div class="container my-5 animate__animated animate__fadeIn">
        <h2 class="display-6 fw-light mb-4">Get in Touch</h2>
        <div class="row">
          <div class="col-lg-7 mb-4 mb-lg-0">
            <div class="bg-white p-4 rounded-3 shadow-sm">
              <form>
                <div class="mb-3">
                  <label for="name" class="form-label">Name</label>
                  <input
                    type="text"
                    class="form-control"
                    id="name"
                    placeholder="Your name"
                  />
                </div>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input
                    type="email"
                    class="form-control"
                    id="email"
                    placeholder="you@example.com"
                  />
                </div>
                <div class="mb-3">
                  <label for="message" class="form-label">Message</label>
                  <textarea
                    class="form-control"
                    id="message"
                    rows="5"
                    placeholder="How can we help?"
                  ></textarea>
                </div>
                <button type="submit" class="btn btn-dark px-4">
                  Send Message (demo)
                </button>
              </form>
            </div>
          </div>
          <div class="col-lg-5">
            <div class="bg-white p-4 rounded-3 shadow-sm h-100">
              <h5 class="fw-light">Store Details</h5>
              <hr />
              <p class="mb-2">
                <strong>Email:</strong><br />bootstrapstore@gmail.com
              </p>
              <p class="mb-2"><strong>Phone:</strong><br />073 985 4141</p>
              <p class="mb-0">
                <strong>Address:</strong><br />123 Main Street<br />Cape Town,
                South Africa
              </p>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-dark text-white text-center py-3">
      <p class="mb-0">&copy; 2026 PokéShop. All rights reserved.</p>
    </footer>
  </body>
</html>
